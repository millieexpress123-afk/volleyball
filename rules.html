   <!-- HEADLINE SECTION -->
    <section class="headline" id="master">
      <div class="headline-overlay">
        <img src="rules2.png" alt="Rules PNG" class="overlay-img" />
        <img src="rules3.png" alt="Rules PNG" class="overlay1-img" />
      </div>
    </section>

<!-- CONTENT SECTION -->
 <section class="content" id="content">
  <div class="content-overlay">
    <img src="rules4.png" alt="Rules PNG" class="overlay2-img"/>
    <img src="rules5.png" alt="Rules PNG" class="overlay3-img"/>
  </div>
 </section>

  <section class="content secondary-content">

      <img src="rules6.png" alt="Rules PNG" class="overlay4-img" />
    </div>
  </section>

  <section class="content third-content">
    <div class="headline-overlay">
      <img src="rules7.png" alt="Rules PNG" class="overlay5-img" />
    </div>
  </section>



<script>
function scrollToHeadline() {
  const element = document.getElementById('master');
  if (element) {
    element.scrollIntoView({ behavior: 'smooth' });
  }
}
const imageObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('animate');
    } else {
      entry.target.classList.remove('animate');
    }
  });
}, {
  threshold: 0.2,
  rootMargin: '0px 0px -100px 0px'
});
// Observe all rule images
const overlayImages = document.querySelectorAll('.overlay-img, .overlay1-img, .overlay2-img, .overlay3-img, .overlay4-img, .overlay5-img');
overlayImages.forEach(img => imageObserver.observe(img));
</script>
